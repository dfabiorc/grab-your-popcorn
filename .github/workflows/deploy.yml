name: CI and deploy

# Every push and pull request runs the checks. Only pushes to main that pass
# them are built with the real TMDB key and published to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; the deploy job asks for what it needs.
permissions:
  contents: read

jobs:
  check:
    name: Lint, test and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # TMDB is mocked in the e2e suite, so no secret is needed here.
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment half way; queue the next one instead.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check the TMDB secret
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$VITE_TMDB_API_KEY" ]; then
            echo "::error::Repository secret TMDB_API_KEY is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      # The key is baked into the static bundle: it is a read-only TMDB key and
      # is visible to anyone using the site (see docs/DECISIONS.md).
      - name: Build
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
