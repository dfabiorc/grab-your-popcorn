<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grab Your Popcorn · Find your next film</title>
    <meta name="description" content="Discover the latest films, with cast, crew, trailers and reviews from TMDB." />
    <meta name="theme-color" content="#F3EEE5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1916" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Grab Your Popcorn" />
    <meta
      property="og:description"
      content="Discover the latest films, with cast, crew, trailers and reviews from TMDB."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        const theme = localStorage.getItem('gyp-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root">
      <!--
        Static shell painted from HTML + CSS alone, before the JS bundle runs.
        React replaces it on mount. Keep it in sync with src/components/Header.tsx.
      -->
      <header class="sticky top-0 z-20 border-b border-line bg-paper">
        <div class="wrap flex h-16 items-center">
          <span class="flex items-center gap-2.5 text-ink">
            <svg
              viewBox="0 0 32 32"
              aria-hidden="true"
              class="size-8"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M8 12.5A3.6 3.6 0 0 1 12 7.4A4.4 4.4 0 0 1 20 6.6A3.6 3.6 0 0 1 24 12.5" />
              <path d="M6.5 12.5h19l-2.15 16.1a1.6 1.6 0 0 1-1.6 1.4h-11.5a1.6 1.6 0 0 1-1.6-1.4z" />
              <path d="M12.6 12.5l.7 17.5M19.4 12.5l-.7 17.5" />
            </svg>
            <span class="hidden display-serif text-[23px] leading-none font-medium whitespace-nowrap sm:inline">
              Grab Your Popcorn
            </span>
          </span>
        </div>
      </header>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
